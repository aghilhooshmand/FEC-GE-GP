# Instrumented diagnostic runs (random rows): selection, memory and per-hit records; each run is checked
# against its stored timing and diagnostic runs of the same seed (python instrument.py check).
name: instrumented_ext_ge
algorithm: GE
datasets: [lhc_jets, covertype, codrna, electricity_cat, MagicTelescope, california, credit, house_16H]
seeds: 30-59
fec: {samplers: [random], fractions: [0.01, 0.05, 0.10]}
modes: [fec_diagnostic]
instrument: true
params: {}
hive: {workers: 80, max_busy: 1.01, all_threads: true}
